# Datasource Oracle
# Aqui eu leio o banco das variáveis de ambiente; o padrão aponta para o Oracle do docker compose
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:esg}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:esg_local_password}

# Aqui eu leio o segredo do JWT da variável de ambiente, com um padrão só para desenvolvimento local
jwt.secret=${JWT_SECRET:chave-local-de-desenvolvimento-com-mais-de-32-caracteres}

# Aqui eu exponho só o health e o info do actuator
management.endpoints.web.exposure.include=health,info

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
jwt.secret=esg-compliance-secret-key-muito-longa-para-seguranca-2024
jwt.expiration=86400000

# App
spring.application.name=esg-compliance-api
server.port=8080

# Hikari pool
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1     